name: Build docker image

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

env:
  SQLX_OFFLINE: true

jobs:
  Test:
    name: Fmt, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # zip 4.x advisories concern extract()/streaming APIs we don't use (fix needs zip>=9, API
        # migration pending); rsa comes from sqlx-mysql which is not compiled in.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Run tests
        run: cargo test

  Build-Docker-Image:
    needs: Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ env.IMAGE }}:latest,ghcr.io/${{ env.IMAGE }}:${{ github.sha }}
          context: .
          file: ./docker/production.dockerfile

      - name: Invoke deployment hook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: curl -fsS --retry 3 --max-time 30 -X POST "${WEBHOOK_URL}?CHANNEL_FILES_CACHE_TAG=${GITHUB_SHA}"
